name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  static-checks:
    name: Static checks (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate XAML / catalog / registry
        run: python3 tools/validate.py

  build-android:
    name: Build (net10.0-android)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build
        shell: pwsh
        run: |
          dotnet build src/MauiGallery/MauiGallery.csproj -f net10.0-android -c Release 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: Report errors on PR
        if: failure()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $errs = Select-String -Path build.log -Pattern ' error ' | ForEach-Object { $_.Line } | Sort-Object -Unique | Select-Object -First 80
          $tail = Get-Content build.log -Tail 60
          "## CI build errors @ ${{ github.sha }}" | Out-File errors.md -Encoding utf8
          '' | Out-File errors.md -Append -Encoding utf8
          '### error lines' | Out-File errors.md -Append -Encoding utf8
          '````' | Out-File errors.md -Append -Encoding utf8
          $errs | Out-File errors.md -Append -Encoding utf8
          '````' | Out-File errors.md -Append -Encoding utf8
          '' | Out-File errors.md -Append -Encoding utf8
          '### build.log tail' | Out-File errors.md -Append -Encoding utf8
          '````' | Out-File errors.md -Append -Encoding utf8
          $tail | Out-File errors.md -Append -Encoding utf8
          '````' | Out-File errors.md -Append -Encoding utf8
          gh pr comment 1 --body-file errors.md

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: src/MauiGallery/bin/Release/net10.0-android/**/*.apk
          if-no-files-found: ignore
          retention-days: 7
