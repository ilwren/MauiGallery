name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  static-checks:
    name: Static checks (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate XAML / catalog / registry
        run: python3 tools/validate.py

  build:
    name: Build ${{ matrix.tfm }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tfm: net10.0-android
            workload: maui-android
          - os: windows-latest
            tfm: net10.0-windows10.0.19041.0
            workload: maui-windows
          - os: macos-latest
            tfm: net10.0-ios
            workload: maui-ios
            extra: -p:RuntimeIdentifier=iossimulator-arm64
          - os: macos-latest
            tfm: net10.0-maccatalyst
            workload: maui-maccatalyst
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install workload ${{ matrix.workload }}
        run: dotnet workload install ${{ matrix.workload }}

      - name: Build ${{ matrix.tfm }}
        shell: pwsh
        run: |
          dotnet build src/MauiGallery/MauiGallery.csproj -f ${{ matrix.tfm }} -p:TargetFrameworks=${{ matrix.tfm }} ${{ matrix.extra }} 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: Report errors on PR
        if: failure()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $errs = Select-String -Path build.log -Pattern ' error ' | ForEach-Object { $_.Line } | Sort-Object -Unique | Select-Object -First 80
          $tail = Get-Content build.log -Tail 40
          "## CI build errors (${{ matrix.tfm }}) @ ${{ github.sha }}" | Out-File errors.md -Encoding utf8
          '' | Out-File errors.md -Append -Encoding utf8
          '### error lines' | Out-File errors.md -Append -Encoding utf8
          '````' | Out-File errors.md -Append -Encoding utf8
          $errs | Out-File errors.md -Append -Encoding utf8
          '````' | Out-File errors.md -Append -Encoding utf8
          '' | Out-File errors.md -Append -Encoding utf8
          '### build.log tail' | Out-File errors.md -Append -Encoding utf8
          '````' | Out-File errors.md -Append -Encoding utf8
          $tail | Out-File errors.md -Append -Encoding utf8
          '````' | Out-File errors.md -Append -Encoding utf8
          gh pr comment 1 --body-file errors.md
