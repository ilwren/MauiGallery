name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  static-checks:
    name: Static checks (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate XAML / catalog / registry
        run: python3 tools/validate.py

  build-android:
    name: Build (net10.0-android)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build
        run: dotnet build src/MauiGallery/MauiGallery.csproj -f net10.0-android -c Release

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: src/MauiGallery/bin/Release/net10.0-android/**/*.apk
          if-no-files-found: ignore
          retention-days: 7
